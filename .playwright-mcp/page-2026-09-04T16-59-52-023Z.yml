          - heading "اختلاف بر سر وضعیت پل" [level=2] [ref=e111]
          - paragraph [ref=e112]: به نقل نیویورک‌تایمز، ارتش آمریکا پل را «مسیر تدارکاتی نظامی برنامه‌ریزی‌شده برای موشک‌ها و پهپادهای ایران» توصیف کرد. رسانه‌های ایران گفتند پل هنوز به بهره‌برداری نرسیده بود و بر پایه گزارش‌ها قرار بود تا ماه مه تکمیل شود.
          - paragraph [ref=e113]: "پرسش حقوقی روشن است: سازه‌ای که هنوز به روی ترافیک باز نشده، چگونه «مسیر تدارکاتی» فعال بوده است؟"
          - heading "واکنش ترامپ" [level=2] [ref=e114]
          - paragraph [ref=e115]:
            - text: "ترامپ تخریب پل را در تروث‌سوشال جشن گرفت و نوشت بزرگ‌ترین پل ایران «فرو ریخت، تا دیگر هرگز استفاده نشود». او ویدئوی فروریختن را منتشر کرد و هدف بعدی را اعلام کرد:"
            - strong [ref=e116]: «حالا پل‌ها، بعد نیروگاه‌های برق!»
          - paragraph [ref=e117]: یک مقام دفاعی آمریکا به آکسیوس گفت احتمالاً پل‌های بیشتری هدف قرار خواهند گرفت. آکسیوس در تیتر خود این حمله را «نخستین بمباران زیرساخت غیرنظامی ایران توسط آمریکا» توصیف کرد.
          - heading "واکنش‌ها" [level=2] [ref=e118]
          - paragraph [ref=e119]: مسعود پزشکیان پرسید آیا تهدید به بازگرداندن یک ملت به عصر حجر «معنایی جز یک جنایت جنگی بزرگ» دارد. رابرت مالی، مذاکره‌کننده پیشین آمریکا در پرونده هسته‌ای ایران، تهدید «عصر حجر» را «توهم‌آمیز» خواند.
          - paragraph [ref=e120]: مهندسان ایرانی — که پل را یکی از دستاوردهای فنی کشور می‌دانستند — بازتاب گسترده‌ای در رسانه‌ها داشتند؛ عرب‌نیوز گزارشی با عنوان «مهندسان ایرانی سوگوار بلندترین پلشان هستند» منتشر کرد.
          - heading "زیرساخت به‌مثابه هدف" [level=2] [ref=e121]
          - paragraph [ref=e122]: "هدف قرار دادن پل‌ها و راه‌آهن در دکترین نظامی کلاسیک به‌عنوان ابزار اختلال در لجستیک دشمن به کار رفته است — در کره، ویتنام و جنگ نخست خلیج فارس. اما در ایران، همان زیرساخت برای جمعیت غیرنظامی هم حیاتی است: پل‌ها در جغرافیای کوهستانی ایران گاه تنها راه دسترسی به مناطق دورافتاده‌اند، و تخریبشان رسیدن امدادگران به مناطق بمباران‌شده را ناممکن می‌کند."
          - paragraph [ref=e123]: ماده ۵۲ پروتکل الحاقی اول کنوانسیون ژنو، هدف نظامی را به اعیانی محدود می‌کند که «به‌طور مؤثر در عملیات نظامی مشارکت دارند» و تخریبشان «مزیت نظامی مشخصی» ایجاد کند. حمله دوم پس از رسیدن امدادگران — الگویی که به «ضربه مضاعف» (double tap) شناخته می‌شود — جداگانه موضوع بررسی حقوقی قرار گرفت.
          - heading "در امتداد یک الگو" [level=2] [ref=e124]
